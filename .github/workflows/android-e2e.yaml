name: Android E2E

# Pull requests run the short smoke journey; manual dispatch runs the longer cache/offline journey.
# Both use a disposable NetBox and never touch the production instance.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'ci/**'
      - '.github/workflows/android-e2e.yaml'

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Disposable NetBox + Android emulator
    runs-on: ubuntu-24.04
    # 50m wasn't enough for a cold software-only boot (no KVM, see below) plus the full 12-test
    # suite: the previous run got through 11/12 tests and was still going when the job itself got
    # cancelled at the timeout.
    timeout-minutes: 90
    env:
      E2E_TOKEN: nbt_CiE2eKey001X.0123456789abcdef0123456789abcdef01234567
      NETBOX_COMPOSE_FILE: ci/netbox/docker-compose.yml
      TEST_CLASS: ${{ github.event_name == 'pull_request' && 'dev.pschmitt.nyetbox.NetBoxPullRequestSmokeSuite' || 'dev.pschmitt.nyetbox.NetBoxFullE2eSuite' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Start disposable NetBox
        run: docker compose -f "$NETBOX_COMPOSE_FILE" up --detach --wait --wait-timeout 600

      - name: Seed deterministic E2E records
        run: |
          seed_result="$(python3 ci/netbox/seed.py --base-url http://127.0.0.1:8000 --token "$E2E_TOKEN")"
          echo "$seed_result"
          echo "E2E_DEVICE_ID=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["device"])' "$seed_result")" >> "$GITHUB_ENV"

      # Build before the emulator starts, not while it's running: compiling concurrently with a
      # booted emulator starves it of CPU, which has previously made the device drop off adb
      # entirely partway through a run (see the Screenshots workflow, which hit this
      # same failure mode first). installDebug below then only needs to install the already-built
      # APK, and connectedDebugAndroidTest only needs an up-to-date check, not a real compile.
      - name: Build the debug and androidTest APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # Re-enabled after a controlled test: two runs without KVM access still hit the same "device
      # offline" failure (once during boot itself, before any test ran), so the earlier bisection
      # pointing at KVM was drawn from too small a sample. Software boot alone takes 15+ minutes
      # and doesn't reliably avoid the issue, so it's not worth trading away for iteration speed.
      # GitHub-hosted runners ship /dev/kvm but don't grant the job user access to it by default.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Android journey in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: google_apis
          force-avd-creation: true
          # Keep the generous timeout for cold runners even with KVM acceleration enabled above.
          emulator-boot-timeout: 1800
          disable-animations: true
          # Diagnostics from two failed runs showed the emulator dropping off adb entirely
          # (`adb devices` reporting it "offline") partway through the journey, with the *host*
          # sitting on 8GB+ free RAM the whole time - so the guest AVD's own default RAM/core
          # allocation, not the runner, was the likely ceiling. Give it real headroom instead of
          # the action's conservative defaults.
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            bash <(curl -fsSL https://raw.githubusercontent.com/pschmitt/android-app-ci/main/scripts/wait-for-android-emulator.sh)
            # Route the emulator's loopback to the runner's disposable NetBox port. This is more
            # reliable on GitHub-hosted Linux runners than relying on the emulator's 10.0.2.2 host
            # alias reaching Docker's published port.
            adb reverse tcp:8000 tcp:8000
            ./gradlew installDebug
            adb shell pm clear dev.pschmitt.nyetbox.debug || true
            # MainActivity requests POST_NOTIFICATIONS on API 33+ during startup. Grant it
            # before Compose launches so the permission dialog cannot interrupt the journey on a
            # slow software emulator after the first composition has already started.
            adb shell pm grant dev.pschmitt.nyetbox.debug android.permission.POST_NOTIFICATIONS || true
            ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class="$TEST_CLASS" -Pandroid.testInstrumentationRunnerArguments.e2e_base_url=http://127.0.0.1:8000 -Pandroid.testInstrumentationRunnerArguments.e2e_token="$E2E_TOKEN" -Pandroid.testInstrumentationRunnerArguments.e2e_device_id="$E2E_DEVICE_ID"

      - name: Capture emulator diagnostics
        if: ${{ failure() }}
        run: |
          {
            echo "--- adb devices ---"
            timeout 10s adb devices -l
            echo "--- host memory ---"
            free -h
            echo "--- host disk ---"
            df -h
          } > e2e-host-diagnostics.txt 2>&1 || true
          timeout 60s adb logcat -d > e2e-logcat.txt || true
          timeout 20s adb exec-out screencap -p > e2e-screenshot.png || true

      - name: Collect E2E screenshots
        if: ${{ always() }}
        run: |
          mkdir -p e2e-screenshots
          adb pull /sdcard/Android/data/dev.pschmitt.nyetbox.debug/files/e2e-screenshots/. e2e-screenshots/ || true

      - name: Capture NetBox diagnostics
        if: ${{ failure() }}
        run: docker compose -f "$NETBOX_COMPOSE_FILE" logs --no-color > e2e-netbox.log || true

      - name: Upload E2E diagnostics and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            e2e-host-diagnostics.txt
            e2e-logcat.txt
            e2e-screenshot.png
            e2e-screenshots/
            e2e-netbox.log
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/

      - name: Tear down disposable NetBox
        if: ${{ always() }}
        run: docker compose -f "$NETBOX_COMPOSE_FILE" down --volumes --remove-orphans
