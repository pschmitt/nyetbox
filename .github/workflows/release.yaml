name: Release

# One pipeline, two release flavors depending on what got pushed:
# - a push to main moves the rolling "latest" prerelease tag and republishes it
# - a push of a semantic-version tag ("vX.Y.Z" or "X.Y.Z") publishes a real, permanent release
# Delegates to pschmitt/android-app-ci's reusable release workflow - see that repo's README for
# the full pipeline (signed APKs, SLSA attestation, checksums, stale-asset vacuuming, screenshot
# refresh trigger).

on:
  push:
    branches:
      - main
    tags:
      - v*
      - '*.*.*'
  workflow_dispatch:

jobs:
  release:
    uses: pschmitt/android-app-ci/.github/workflows/release.yaml@main
    with:
      app-display-name: Nyetbox
      application-id: dev.pschmitt.nyetbox
      artifact-label: nyetbox
    secrets: inherit
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
