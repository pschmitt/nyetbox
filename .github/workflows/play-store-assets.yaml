name: Play Store Assets

# Screenshot/icon uploads to the Play Console listing are content-triggered, not tag-triggered:
# whenever a change to the committed screenshot images lands on main - i.e. the "Update
# screenshots" PR that screenshots.yaml opens gets merged - push exactly what's now in the repo to
# the release package's Play Console listing. Delegates to pschmitt/android-app-ci's reusable
# workflow, which requires the same PLAY_SERVICE_ACCOUNT_JSON secret as play-store.yaml.

on:
  push:
    branches:
      - main
    paths:
      - 'fastlane/metadata/android/en-US/images/**'
  workflow_dispatch:

jobs:
  upload:
    uses: pschmitt/android-app-ci/.github/workflows/play-store-images.yaml@main
    with:
      application-id: dev.pschmitt.nyetbox
    secrets: inherit
