[versions]
aboutlibraries = "15.0.4"
android-plugin = "9.3.1"
androidx-activity = "1.13.0"
# Shared by the :baselineprofile macrobenchmark module and androidx.profileinstaller in :app -
# both are versioned together upstream (NBC-426).
androidx-baselineprofile = "1.5.0-beta01"
androidx-camera = "1.6.1"
androidx-compose = "1.11.4"
# Decoupled from androidx-compose above - this artifact's release cadence lags the rest of Compose
# (last published at 1.7.8), but it's just a large set of static ImageVector vals with no API
# coupling to the newer compose-ui/foundation versions, so it's safe to pin independently.
androidx-compose-material-icons-extended = "1.7.8"
androidx-compose-material3 = "1.4.0"
androidx-core = "1.19.0"
androidx-core-splashscreen = "1.2.0"
