androidx-profileinstaller = "1.4.1"
androidx-room = "2.8.4"
androidx-security-crypto = "1.1.0"
androidx-biometric = "1.1.0"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-uiautomator = "2.4.0"
androidx-espresso = "3.7.0"
